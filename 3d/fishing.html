<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>さかなつり ｜ 3Dあそび</title>
<meta name="description" content="ゆびでつりばりをうごかして、およぐ3Dのさかなをつかまえるあそび。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A3%3C/text%3E%3C/svg%3E">
<style>
  body { background: #cfeaf7; }
  #basket {
    position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 30;
    background: rgba(255,255,255,.88); color: #35706a; border-radius: 99px;
    padding: 9px 18px; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 0 rgba(0,0,0,.1); pointer-events: none;
    font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji", inherit;
  }
</style>
</head>
<body>
<div id="basket">🐟 0</div>

<script type="module">
import { boot, makeStage, addLights, makeSound, addHomeButton, addSoundButton, addHint, addCheer, confetti, SCALE, rand, pick }
  from './common.js';

const { THREE } = await boot({ mark: '🎣' });

const POND_R = 5.2;        // 池のひろさ
const SWIM_Y = -0.72;      // さかながおよぐふかさ
const CATCH_D = 0.62;      // このきょりまで近づくとつれる

const PORTRAIT = window.innerHeight > window.innerWidth;
const stage = makeStage(THREE, { bg: '#cfeaf7', fog: { color: '#dff0fa', near: 24, far: 60 }, fov: PORTRAIT ? 58 : 48 });
const { scene, camera, renderer } = stage;
// さかなが見えるよう、水面をななめ上から のぞきこむ角度にする
camera.position.set(0, 4.8, 6.9);
camera.lookAt(0, -0.8, 0);

addLights(THREE, scene, { sky: '#ffffff', ground: '#7fbfa8', hemi: 1.3, sun: 2.3, from: [5, 12, 7], at: [0, 0, 0], span: 11 });

const sound = makeSound();
addHomeButton('index.html');
addSoundButton(sound);
const hint = addHint('ゆびで つりばりを うごかしてみよう');
const cheer = addCheer();
const basketEl = document.getElementById('basket');

// ---------------------------------------------------------------
// 池
// ---------------------------------------------------------------
// きしべ（池の中が見えるよう、まん中に穴のあいた輪にする）
const bankMat = new THREE.MeshStandardMaterial({ color: '#95d9a4', roughness: 1 });
const bank = new THREE.Mesh(new THREE.RingGeometry(POND_R, POND_R + 3.4, 72), bankMat);
bank.rotation.x = -Math.PI / 2;
bank.position.y = 0.04;
bank.receiveShadow = true;
scene.add(bank);

// きしべの厚み
const skirt = new THREE.Mesh(
  new THREE.CylinderGeometry(POND_R + 3.4, POND_R + 3.4, 1.9, 64, 1, true),
  new THREE.MeshStandardMaterial({ color: '#7cbe8d', roughness: 1, side: THREE.DoubleSide })
);
skirt.position.y = -0.9;
scene.add(skirt);

// 池のかべ（内がわを見せる）
const wallMat = new THREE.MeshStandardMaterial({
  color: '#1f93c4', roughness: 0.85, side: THREE.BackSide,
});
const pondWall = new THREE.Mesh(
  new THREE.CylinderGeometry(POND_R, POND_R, 1.9, 64, 1, true), wallMat
);
pondWall.position.y = -0.9;
scene.add(pondWall);

// 池のそこ（この色が「水の色」に見える）
const bottom = new THREE.Mesh(
  new THREE.CircleGeometry(POND_R, 64),
  new THREE.MeshStandardMaterial({ color: '#1f93c4', roughness: 0.85 })
);
bottom.rotation.x = -Math.PI / 2;
bottom.position.y = -1.85;
bottom.receiveShadow = true;
scene.add(bottom);

// 石と水草
for (let i = 0; i < 26; i++) {
  const a = rand(0, Math.PI * 2), r = rand(0.6, POND_R - 0.5);
  if (i % 2 === 0) {
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(rand(0.1, 0.24), 8, 6),
      new THREE.MeshStandardMaterial({ color: pick(['#d9cdb4', '#c6bba4', '#efe5cc']), roughness: 1 })
    );
    s.position.set(Math.cos(a) * r, -1.81, Math.sin(a) * r);
    s.scale.y = 0.55;
    scene.add(s);
  } else {
    const w = new THREE.Mesh(
      new THREE.ConeGeometry(0.1, rand(0.5, 1.0), 5),
      new THREE.MeshStandardMaterial({ color: pick(['#4f9e5e', '#3d8a63', '#6fb36a']), roughness: 1 })
    );
    w.position.set(Math.cos(a) * r, -1.55, Math.sin(a) * r);
    scene.add(w);
  }
}

// 水面（さざなみが立つ）
// RingGeometry の内半径をほぼ0にすると、まん中まで細かく割れた円になる（波を立てるのに必要）
const waterGeo = new THREE.RingGeometry(0.001, POND_R, 64, 14);
const waterPos = waterGeo.attributes.position;
const waterBase = Float32Array.from(waterPos.array);
const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({
  color: '#cdf1ff', roughness: 0.06, metalness: 0.35,
  transparent: true, opacity: 0.17, side: THREE.DoubleSide, depthWrite: false,
}));
water.rotation.x = -Math.PI / 2;
water.renderOrder = 2;   // さかなのうえに重ねて描く
scene.add(water);

// 池のふち（水と草のさかいめをはっきりさせる）
const rim = new THREE.Mesh(
  new THREE.TorusGeometry(POND_R, 0.16, 10, 72),
  new THREE.MeshStandardMaterial({ color: '#79b489', roughness: 1 })
);
rim.rotation.x = -Math.PI / 2;
rim.position.y = 0.02;
rim.receiveShadow = true;
scene.add(rim);

// ---------------------------------------------------------------
// さかな
// ---------------------------------------------------------------
const FISH_COLORS = ['#ff8a3d', '#ffd24a', '#5bd1f0', '#ff6f91', '#8be08b', '#d7a3ff', '#ffffff'];

function makeFish(color, size) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.05 });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.3, 18, 14), mat);
  body.scale.set(0.72, 0.78, 1.5);
  body.castShadow = true;
  g.add(body);

  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.34, 4), mat);
  tail.rotation.x = Math.PI / 2;
  tail.rotation.y = Math.PI / 4;
  tail.position.z = -0.52;
  tail.scale.set(1, 1, 0.35);
  g.add(tail);

  const fin = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.22, 4), mat);
  fin.position.set(0, 0.2, 0);
  fin.scale.set(1, 1, 0.4);
  g.add(fin);

  const eyeMat = new THREE.MeshStandardMaterial({ color: '#20242e', roughness: 0.3 });
  for (const sx of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), eyeMat);
    e.position.set(sx * 0.13, 0.08, 0.3);
    g.add(e);
  }

  g.scale.setScalar(size);
  g.userData.tail = tail;
  return g;
}

const fishes = [];
function spawnFish(atEdge = false) {
  const size = rand(1.05, 1.7);
  const g = makeFish(pick(FISH_COLORS), size);
  const a = rand(0, Math.PI * 2);
  const r = atEdge ? POND_R - 0.7 : rand(1, POND_R - 0.8);
  g.position.set(Math.cos(a) * r, SWIM_Y + rand(-0.25, 0.25), Math.sin(a) * r);
  scene.add(g);
  const f = {
    g, size,
    dir: rand(0, Math.PI * 2),
    speed: rand(0.9, 1.9) / size,     // 小さいさかなほどすばやい
    wobble: rand(6, 11),
    phase: rand(0, Math.PI * 2),
    state: 'swim',
    t: 0,
  };
  fishes.push(f);
  return f;
}
for (let i = 0; i < 10; i++) spawnFish();

// ---------------------------------------------------------------
// つりざおとつりばり
// ---------------------------------------------------------------
const rodTip = new THREE.Vector3(3.9, 3.1, 4.6);
{
  const rod = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.06, 6.4, 10),
    new THREE.MeshStandardMaterial({ color: '#8d6b3f', roughness: 0.8 })
  );
  rod.position.set(5.0, 1.1, 5.9);
  rod.rotation.set(-0.5, 0, 0.42);
  rod.castShadow = true;
  scene.add(rod);
}

const hook = new THREE.Group();
{
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.12, 0.028, 10, 22, Math.PI * 1.5),
    new THREE.MeshStandardMaterial({ color: '#dfe6f0', roughness: 0.25, metalness: 0.75 })
  );
  ring.rotation.y = Math.PI / 2;
  ring.position.y = -0.12;
  hook.add(ring);
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.025, 0.025, 0.26, 8),
    ring.material
  );
  shaft.position.y = 0.05;
  hook.add(shaft);
  // あかいうき（どこにあるか見やすいように）
  const bob = new THREE.Mesh(
    new THREE.SphereGeometry(0.17, 14, 10),
    new THREE.MeshStandardMaterial({ color: '#ff5b5b', roughness: 0.4 })
  );
  bob.position.y = 0.42;
  hook.add(bob);
}
scene.add(hook);

// 水面にうつる波もん
const ripple = new THREE.Mesh(
  new THREE.RingGeometry(0.22, 0.3, 28),
  new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.7, side: THREE.DoubleSide })
);
ripple.rotation.x = -Math.PI / 2;
ripple.position.y = 0.02;
scene.add(ripple);

// つり糸
const lineGeo = new THREE.BufferGeometry().setFromPoints([rodTip.clone(), new THREE.Vector3()]);
const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.75 }));
line.frustumCulled = false;
scene.add(line);

const hookPos = new THREE.Vector3(0, SWIM_Y, 1.5);
const hookGoal = hookPos.clone();
let reeling = null;     // つり上げているさかな
let reelT = 0;
let caught = 0;

// ---------------------------------------------------------------
// そうさ：ゆびの位置を水中の高さの面にうつして、つりばりを動かす
// ---------------------------------------------------------------
const rayc = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const swimPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -SWIM_Y);
const hitPoint = new THREE.Vector3();

function moveHookTo(clientX, clientY) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((clientY - r.top) / r.height) * 2 + 1;
  rayc.setFromCamera(ndc, camera);
  if (!rayc.ray.intersectPlane(swimPlane, hitPoint)) return;
  // 池の外には出さない
  const d = Math.hypot(hitPoint.x, hitPoint.z);
  if (d > POND_R - 0.4) {
    hitPoint.x *= (POND_R - 0.4) / d;
    hitPoint.z *= (POND_R - 0.4) / d;
  }
  hookGoal.set(hitPoint.x, SWIM_Y, hitPoint.z);
}

let dragging = false;
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('button')) return;
  e.preventDefault();
  sound.unlock();
  dragging = true;
  moveHookTo(e.clientX, e.clientY);
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (dragging) moveHookTo(e.clientX, e.clientY);
});
for (const ev of ['pointerup', 'pointercancel']) {
  renderer.domElement.addEventListener(ev, (e) => {
    dragging = false;
    try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (err) { /* 解放ずみ */ }
  });
}

// ---------------------------------------------------------------
// つる
// ---------------------------------------------------------------
function hookFish(f) {
  f.state = 'hooked';
  reeling = f;
  reelT = 0;
  sound.tone({ freq: 880, type: 'sine', dur: 0.18, gain: 0.2, sweep: 1.6 });
  hint.hide();
}

function landFish(f) {
  scene.remove(f.g);
  fishes.splice(fishes.indexOf(f), 1);
  caught++;
  basketEl.textContent = '🐟 ' + caught;
  sound.noise({ dur: 0.2, gain: 0.2, cut: 1200 });
  sound.tone({ freq: SCALE[caught % SCALE.length], type: 'triangle', dur: 0.45, gain: 0.22, delay: 0.05 });
  if (caught % 5 === 0) {
    cheer(caught + 'ひき！', '#ffe066');
    confetti(60);
    sound.fanfare();
  } else {
    cheer('つれた！', '#ffffff');
  }
  spawnFish(true);
  reeling = null;
}

// ---------------------------------------------------------------
// うごかす
// ---------------------------------------------------------------
const linePts = [rodTip.clone(), new THREE.Vector3()];

stage.run((dt, t) => {
  // 水面をゆらす
  for (let i = 0; i < waterPos.count; i++) {
    const x = waterBase[i * 3], y = waterBase[i * 3 + 1];
    waterPos.array[i * 3 + 2] = Math.sin(x * 1.1 + t * 1.5) * 0.07 + Math.cos(y * 1.4 - t * 1.1) * 0.05;
  }
  waterPos.needsUpdate = true;
  waterGeo.computeVertexNormals();   // 光のあたり方も波に合わせる

  // つりばり
  if (reeling) {
    reelT += dt;
    const up = Math.min(reelT / 0.9, 1);
    hookPos.y = SWIM_Y + up * (1.9 - SWIM_Y);
    reeling.g.position.copy(hookPos);
    reeling.g.position.y -= 0.25;
    reeling.g.rotation.set(-1.1, t * 6, 0);   // つり上げられてバタバタする
    if (up >= 1) landFish(reeling);
  } else {
    hookPos.lerp(hookGoal, 1 - Math.exp(-dt * 7));
    hookPos.y += (SWIM_Y - hookPos.y) * (1 - Math.exp(-dt * 6));
  }
  hook.position.copy(hookPos);

  ripple.position.set(hookPos.x, 0.02, hookPos.z);
  const s = 1 + Math.sin(t * 3) * 0.12;
  ripple.scale.set(s, s, 1);

  linePts[1].copy(hookPos).setY(hookPos.y + 0.5);
  lineGeo.setFromPoints(linePts);

  // さかな
  for (const f of fishes) {
    if (f.state !== 'swim') continue;
    f.t += dt;
    // ときどきゆるやかに向きを変える
    f.dir += Math.sin(f.t * 0.7 + f.phase) * 0.6 * dt;
    const nx = f.g.position.x + Math.sin(f.dir) * f.speed * dt;
    const nz = f.g.position.z + Math.cos(f.dir) * f.speed * dt;
    if (Math.hypot(nx, nz) > POND_R - 0.6) {
      // きしにぶつかったら、池のまん中のほうへ向きなおす
      f.dir = Math.atan2(-f.g.position.x, -f.g.position.z) + rand(-0.5, 0.5);
    } else {
      f.g.position.x = nx;
      f.g.position.z = nz;
    }
    f.g.position.y = SWIM_Y + Math.sin(f.t * 1.3 + f.phase) * 0.12;
    f.g.rotation.y = f.dir;
    f.g.rotation.z = Math.sin(f.t * f.wobble) * 0.09;
    f.g.userData.tail.rotation.z = Math.sin(f.t * f.wobble) * 0.5;

    if (!reeling) {
      const d = f.g.position.distanceTo(hookPos);
      if (d < CATCH_D * f.size) hookFish(f);
    }
  }
});
</script>
</body>
</html>
