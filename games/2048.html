<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 ｜ ミニゲームセンター</title>
<meta name="description" content="同じ数字のタイルを合体させて2048を目指すパズルゲーム。キーボードの矢印キーとスワイプに対応。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A2%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0f1020; --panel:#191a33; --panel-2:#212241; --text:#e8e9f5;
    --muted:#a4a7c9; --line:#33355e; --accent:#7c6cff;
    --board:#212241; --cell:#2a2b50;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7fb; --panel:#fff; --panel-2:#f0f1f8; --text:#1b1c30; --muted:#5b5e80; --line:#dfe1ee;
            --board:#e5e6f2; --cell:#f2f3fa; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.7;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 56px; }
  .back { display: inline-block; color: var(--muted); text-decoration: none; font-size: .85rem; margin-bottom: 14px; }
  .back:hover { color: var(--accent); }
  h1 { font-size: 1.8rem; margin: 0 0 4px; letter-spacing: -.02em; }
  .lead { color: var(--muted); font-size: .88rem; margin: 0 0 20px; }

  .hud { display: flex; gap: 10px; align-items: stretch; margin-bottom: 14px; }
  .score { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; text-align: center; }
  .score .label { display: block; color: var(--muted); font-size: .7rem; letter-spacing: .08em; }
  .score .value { display: block; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  button.btn {
    font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0;
    border-radius: 12px; padding: 10px 18px; cursor: pointer; transition: filter .15s ease;
  }
  button.btn:hover { filter: brightness(1.12); }
  button.btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); }

  #board {
    position: relative; background: var(--board); border-radius: 14px; padding: var(--gap);
    aspect-ratio: 1 / 1; touch-action: none; user-select: none; --gap: 10px;
  }
  .grid { position: absolute; inset: var(--gap); display: grid; grid-template: repeat(4, 1fr) / repeat(4, 1fr); gap: var(--gap); }
  .grid div { background: var(--cell); border-radius: 8px; }
  .tiles { position: absolute; inset: var(--gap); }
  .tile {
    position: absolute; width: var(--size); height: var(--size); border-radius: 8px;
    display: grid; place-items: center; font-weight: 800; font-size: calc(var(--size) * .42);
    transition: transform .1s ease-in-out; will-change: transform;
    background: #3a3c6e; color: #fff;
  }
  .tile.pop { animation: pop .18s ease-out; }
  .tile.merged { animation: merge .18s ease-out; }
  @keyframes pop { from { transform: var(--pos) scale(.2); opacity: 0; } }
  @keyframes merge { 0% { transform: var(--pos) scale(1); } 55% { transform: var(--pos) scale(1.18); } 100% { transform: var(--pos) scale(1); } }
  .t2    { background:#eee4da; color:#6b6154; }
  .t4    { background:#ede0c8; color:#6b6154; }
  .t8    { background:#f2b179; color:#fff; }
  .t16   { background:#f59563; color:#fff; }
  .t32   { background:#f67c5f; color:#fff; }
  .t64   { background:#f65e3b; color:#fff; }
  .t128  { background:#edcf72; color:#fff; font-size: calc(var(--size) * .36); }
  .t256  { background:#edcc61; color:#fff; font-size: calc(var(--size) * .36); }
  .t512  { background:#edc850; color:#fff; font-size: calc(var(--size) * .36); }
  .t1024 { background:#7c6cff; color:#fff; font-size: calc(var(--size) * .3); }
  .t2048 { background:#5b4bff; color:#fff; font-size: calc(var(--size) * .3); box-shadow: 0 0 24px rgba(124,108,255,.7); }
  .big   { background:#2f2a6b; color:#fff; font-size: calc(var(--size) * .28); }

  .overlay {
    position: absolute; inset: 0; border-radius: 14px; display: grid; place-content: center; gap: 12px;
    text-align: center; background: color-mix(in srgb, var(--board) 96%, transparent);
    backdrop-filter: blur(2px); z-index: 5;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 1.7rem; }
  .overlay p { margin: 0; color: var(--muted); font-size: .9rem; }
  .overlay .row { display: flex; gap: 8px; justify-content: center; }

  .help { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: .85rem; color: var(--muted); }
  .help b { color: var(--text); }
  kbd { display: inline-block; background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 7px; margin: 0 1px; font-size: .95em; line-height: 1.5; color: var(--text); }
  .pad { display: none; grid-template: repeat(2, 44px) / repeat(3, 44px); gap: 6px; justify-content: center; margin-top: 14px; }
  @media (hover: none) { .pad { display: grid; } }
  .pad button { font: inherit; font-size: 1.1rem; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .pad .up { grid-column: 2; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← ミニゲームセンター</a>
  <h1>2048</h1>
  <p class="lead">同じ数字どうしをぶつけて合体。2048のタイルを作れたら勝ちです。</p>

  <div class="hud">
    <div class="score"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
    <div class="score"><span class="label">BEST</span><span class="value" id="best">0</span></div>
    <button class="btn" id="new">はじめから</button>
  </div>

  <div id="board">
    <div class="grid"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ovTitle">おわり</h2>
      <p id="ovText"></p>
      <div class="row">
        <button class="btn" id="ovRetry">もう一度</button>
        <button class="btn ghost" id="ovContinue" hidden>このまま続ける</button>
      </div>
    </div>
  </div>

  <div class="pad">
    <button class="up" data-dir="up">↑</button>
    <button data-dir="left">←</button>
    <button data-dir="down">↓</button>
    <button data-dir="right">→</button>
  </div>

  <div class="help">
    <b>あそびかた</b><br>
    <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> または画面のスワイプでタイルを寄せます。
    同じ数字が重なると合体して2倍に。動かすたびに新しいタイルが1つ増え、盤面が埋まって動かせなくなったらゲームオーバーです。
  </div>
</div>

<script>
(() => {
  'use strict';
  const SIZE = 4;
  const KEY = 'minigames.2048.best';

  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const boardEl = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovContinue = document.getElementById('ovContinue');

  let cells, score, best, uid, won, over, busy;

  function loadBest() {
    try { return Number(localStorage.getItem(KEY)) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(KEY, String(v)); } catch (e) {}
  }

  function start() {
    cells = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    score = 0; uid = 0; won = false; over = false; busy = false;
    tilesEl.textContent = '';
    overlay.hidden = true;
    ovContinue.hidden = true;
    addRandom(); addRandom();
    render();
    updateScore();
  }

  function emptyCells() {
    const list = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!cells[r][c]) list.push([r, c]);
    return list;
  }

  function addRandom() {
    const list = emptyCells();
    if (!list.length) return null;
    const [r, c] = list[Math.floor(Math.random() * list.length)];
    const tile = { id: ++uid, r, c, value: Math.random() < 0.9 ? 2 : 4, isNew: true, merged: false, el: null };
    cells[r][c] = tile;
    return tile;
  }

  function className(v) {
    return v <= 2048 ? 't' + v : 'big';
  }

  function render() {
    const gap = parseFloat(getComputedStyle(boardEl).getPropertyValue('--gap'));
    const inner = tilesEl.clientWidth;
    const size = (inner - gap * (SIZE - 1)) / SIZE;
    const alive = new Set();

    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const t = cells[r][c];
      if (!t) continue;
      alive.add(t.id);
      if (!t.el) {
        t.el = document.createElement('div');
        t.el._id = t.id;
        tilesEl.appendChild(t.el);
      }
      const pos = `translate(${c * (size + gap)}px, ${r * (size + gap)}px)`;
      t.el.style.setProperty('--size', size + 'px');
      t.el.style.setProperty('--pos', pos);
      t.el.style.transform = pos;
      t.el.textContent = t.value;
      t.el.className = 'tile ' + className(t.value)
        + (t.isNew ? ' pop' : '') + (t.merged ? ' merged' : '');
      t.isNew = false; t.merged = false;
    }
    for (const el of [...tilesEl.children]) {
      if (el._id && !alive.has(el._id)) el.remove();
    }
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > best) { best = score; saveBest(best); }
    bestEl.textContent = best;
  }

  // 方向ごとの走査順をつくる。dr/dc の向きに詰める。
  function move(dir) {
    if (busy || over) return;
    const [dr, dc] = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] }[dir];
    const rows = [...Array(SIZE).keys()];
    const cols = [...Array(SIZE).keys()];
    if (dr > 0) rows.reverse();
    if (dc > 0) cols.reverse();

    let moved = false;
    const removed = [];

    for (const r of rows) for (const c of cols) {
      const tile = cells[r][c];
      if (!tile) continue;
      let nr = r, nc = c;
      while (true) {
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
        const target = cells[tr][tc];
        if (!target) { nr = tr; nc = tc; continue; }
        if (target.value === tile.value && !target.merged && !tile.merged) {
          // 合体：移動元のタイルは移動先へ滑らせてから消す
          cells[r][c] = null;
          target.value *= 2;
          target.merged = true;
          score += target.value;
          if (target.value === 2048 && !won) won = true;
          tile.r = tr; tile.c = tc;
          removed.push(tile);
          moved = true;
        }
        break;
      }
      if (removed.includes(tile)) continue;
      if (nr !== r || nc !== c) {
        cells[r][c] = null;
        cells[nr][nc] = tile;
        tile.r = nr; tile.c = nc;
        moved = true;
      }
    }

    if (!moved) return;

    busy = true;
    // 消えるタイルも一旦移動先に描いてからDOMを外す
    for (const t of removed) {
      if (!t.el) continue;
      const gap = parseFloat(getComputedStyle(boardEl).getPropertyValue('--gap'));
      const size = (tilesEl.clientWidth - gap * (SIZE - 1)) / SIZE;
      t.el.style.transform = `translate(${t.c * (size + gap)}px, ${t.r * (size + gap)}px)`;
      t.el.style.zIndex = '1';
    }
    render();
    updateScore();

    setTimeout(() => {
      for (const t of removed) if (t.el) t.el.remove();
      addRandom();
      render();
      busy = false;
      checkState();
    }, 110);
  }

  function canMove() {
    if (emptyCells().length) return true;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const v = cells[r][c].value;
      if (r + 1 < SIZE && cells[r + 1][c].value === v) return true;
      if (c + 1 < SIZE && cells[r][c + 1].value === v) return true;
    }
    return false;
  }

  function checkState() {
    if (won === true) {
      won = 'shown';
      ovTitle.textContent = '2048 達成！🎉';
      ovText.textContent = `スコア ${score} 点。まだ盤面は動きます。`;
      ovContinue.hidden = false;
      overlay.hidden = false;
      return;
    }
    if (!canMove()) {
      over = true;
      ovTitle.textContent = 'ゲームオーバー';
      ovText.textContent = `スコア ${score} 点／ベスト ${best} 点`;
      ovContinue.hidden = true;
      overlay.hidden = false;
    }
  }

  // 入力
  const keyMap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                   w: 'up', s: 'down', a: 'left', d: 'right' };
  addEventListener('keydown', (e) => {
    const dir = keyMap[e.key];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  });

  let sx = 0, sy = 0, tracking = false;
  boardEl.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; tracking = true; });
  boardEl.addEventListener('pointerup', (e) => {
    if (!tracking) return;
    tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.hypot(dx, dy) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  boardEl.addEventListener('pointercancel', () => { tracking = false; });

  document.querySelectorAll('.pad button').forEach((b) => {
    b.addEventListener('click', () => move(b.dataset.dir));
  });

  document.getElementById('new').addEventListener('click', start);
  document.getElementById('ovRetry').addEventListener('click', start);
  ovContinue.addEventListener('click', () => { overlay.hidden = true; });
  addEventListener('resize', () => render());

  best = loadBest();
  start();
})();
</script>
</body>
</html>
