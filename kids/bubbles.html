<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>しゃぼんだま ｜ こどもあそび</title>
<meta name="description" content="ふわふわ浮かぶシャボン玉を指でタッチすると、ポンッとはじけます。1歳から遊べる知育あそび。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AB%A7%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; touch-action: none;
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "Yu Gothic", system-ui, sans-serif;
    background: #bfe9ff;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* 子どもが触っても画面が変わらないよう、戻るボタンは長押しで反応する */
  .home, .sound {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 10;
    width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: rgba(255,255,255,.88); color: #4a6b7c; font-size: 22px; line-height: 1;
    display: grid; place-items: center; overflow: hidden;
  }
  /* 自動再生の制限でおとが出ないとき、タップでかいじょするボタン */
  .sound { left: 72px; }
  .sound.waiting { animation: soundWait 1.2s ease-in-out infinite; }
  @keyframes soundWait { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  @media (prefers-reduced-motion: reduce) { .sound.waiting { animation: none; outline: 3px solid #fff; } }
  .home i { position: absolute; inset: 0; background: #7cc6e8; transform: scaleY(0); transform-origin: bottom; }
  .home span { position: relative; }
  .hint {
    position: fixed; left: 50%; translate: -50% 0; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 10;
    background: rgba(255,255,255,.72); color: #4a6b7c; font-size: 15px; font-weight: 700;
    padding: 7px 18px; border-radius: 99px; pointer-events: none; white-space: nowrap;
    transition: opacity .6s ease;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="home" id="home" aria-label="ホームにもどる（ながおし）"><i id="homeFill"></i><span>🏠</span></button>
<button class="sound" id="sound" aria-label="タップしておとをだす"><span id="soundIcon">🔇</span></button>
<div class="hint" id="hint">さわってみてね</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  const FACES = ['🐰','🐱','🐶','🐤','🐸','🐷','🍓','🍌','🍎','⭐','🌸','🚗','🎈','🐟','🦋'];
  const TINTS = ['#ffd6ec','#d6ecff','#d9ffe0','#fff3c4','#e8dcff','#ffe0d1'];

  const bubbles = [];
  const sparks = [];
  const rings = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  function targetCount() {
    return Math.max(7, Math.min(13, Math.round(W * H / 38000)));
  }

  function spawn(atBottom = true) {
    const r = 42 + Math.random() * Math.min(46, W * 0.09);
    bubbles.push({
      x: r + Math.random() * Math.max(1, W - r * 2),
      y: atBottom ? H + r + Math.random() * 120 : Math.random() * H,
      r,
      vy: -(0.28 + Math.random() * 0.4),
      sway: 0.5 + Math.random() * 1.2,
      phase: Math.random() * Math.PI * 2,
      tint: TINTS[Math.floor(Math.random() * TINTS.length)],
      face: FACES[Math.floor(Math.random() * FACES.length)],
      born: performance.now(),
    });
  }
  for (let i = 0; i < targetCount(); i++) spawn(false);

  // ---- 音（外部ファイルなしで合成） ----
  let ac = null;
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        ac = new AC();
        // suspended ⇔ running の変化をおとボタンの見ために反映する
        ac.addEventListener('statechange', refreshSound);
      }
    }
    // ブラウザの自動再生制限で止まっているときは、ここで解除をこころみる
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }

  // ---- おとボタン ----
  // AudioContext はユーザー操作があるまで suspended のままで音が出ない。
  // 「押せば必ず音が出る」入口をひとつ置き、いま鳴らせる状態かどうかも見せる。
  const soundBtn = document.getElementById('sound');
  const soundIcon = document.getElementById('soundIcon');

  function refreshSound() {
    const ready = !!ac && ac.state === 'running';
    soundIcon.textContent = ready ? '🔊' : '🔇';
    soundBtn.classList.toggle('waiting', !ready);
    soundBtn.setAttribute('aria-label', ready ? 'おとがでています' : 'タップしておとをだす');
  }

  // かくにん用の音。suspended のまま予約しても、解除された瞬間に鳴る
  function soundCheck() {
    const a = audio();
    if (!a) return;
    const t = a.currentTime;
    [523, 784].forEach((f, i) => {
      const s = t + i * 0.09;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, s);
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.22, s + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.4);
      o.connect(g).connect(a.destination);
      o.start(s); o.stop(s + 0.45);
    });
  }

  soundBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    soundCheck();
    refreshSound();
  });
  // タブを離れると中断されることがあるので、戻ってきたら見ためを合わせ直す
  document.addEventListener('visibilitychange', refreshSound);
  refreshSound();
  function pop(size) {
    const a = audio();
    if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = 'sine';
    const base = 900 - size * 4;
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(140, base * 0.35), t + 0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + 0.26);
  }
  function twinkle() {
    const a = audio();
    if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(1400 + Math.random() * 500, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + 0.2);
  }

  // ---- タッチ ----
  function burst(b) {
    rings.push({ x: b.x, y: b.y, r: b.r, life: 1 });
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1.5 + Math.random() * 3.5;
      sparks.push({
        x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, color: b.tint, size: 3 + Math.random() * 4,
      });
    }
    sparks.push({ x: b.x, y: b.y, vx: 0, vy: -1.4, life: 1, face: b.face, size: b.r * 0.7 });
    pop(b.r);
  }

  function touch(x, y) {
    let hit = false;
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      // 指は太いので、少し大きめの当たり判定にする
      if (Math.hypot(b.x - x, b.y - y) < b.r + 18) {
        burst(b);
        bubbles.splice(i, 1);
        hit = true;
        break;
      }
    }
    if (!hit) {
      // 何もないところを触っても、必ずキラキラで応える
      for (let i = 0; i < 6; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1 + Math.random() * 2.2;
        sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .8, color: '#ffffff', size: 3 + Math.random() * 3 });
      }
      twinkle();
    }
    hideHint();
  }

  cv.addEventListener('pointerdown', (e) => { touch(e.clientX, e.clientY); });
  cv.addEventListener('pointermove', (e) => { if (e.pressure > 0 || e.buttons) touch(e.clientX, e.clientY); });

  const hint = document.getElementById('hint');
  let hintTimer = null;
  function hideHint() {
    hint.style.opacity = '0';
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { hint.style.opacity = '1'; }, 12000);
  }

  // ---- 描画 ----
  function drawBubble(b) {
    const g = ctx.createRadialGradient(b.x - b.r * .3, b.y - b.r * .35, b.r * .1, b.x, b.y, b.r);
    g.addColorStop(0, 'rgba(255,255,255,.95)');
    g.addColorStop(.45, b.tint + 'cc');
    g.addColorStop(1, 'rgba(255,255,255,.45)');
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.stroke();

    ctx.font = `${b.r * 0.92}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = .92;
    ctx.fillStyle = '#333';
    ctx.fillText(b.face, b.x, b.y + b.r * .04);
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.ellipse(b.x - b.r * .38, b.y - b.r * .42, b.r * .17, b.r * .12, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.fill();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 16.666, 3);
    last = now;

    // 背景
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#c9ecff');
    bg.addColorStop(1, '#eafbff');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.phase += 0.018 * dt;
      b.y += b.vy * dt;
      b.x += Math.sin(b.phase) * b.sway * 0.5 * dt;
      // 泡が画面の端で切れると押しにくいので、少し内側に留める
      if (b.x < b.r) b.x = b.r;
      if (b.x > W - b.r) b.x = W - b.r;
      if (b.y + b.r < -20) bubbles.splice(i, 1);
      else drawBubble(b);
    }
    while (bubbles.length < targetCount()) spawn(true);

    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.life -= 0.055 * dt;
      if (r.life <= 0) { rings.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r * (1 + (1 - r.life) * 0.9), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${r.life})`;
      ctx.lineWidth = 6 * r.life;
      ctx.stroke();
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vy += 0.06 * dt; s.vx *= 0.985;
      s.life -= 0.018 * dt;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, Math.min(1, s.life));
      if (s.face) {
        ctx.font = `${s.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#333';
        ctx.fillText(s.face, s.x, s.y);
      } else {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- 長押しでホームへ ----
  const homeBtn = document.getElementById('home');
  const fill = document.getElementById('homeFill');
  let holdTimer = null;
  function holdStart() {
    fill.style.transition = 'transform .9s linear';
    fill.style.transform = 'scaleY(1)';
    holdTimer = setTimeout(() => { location.href = 'index.html'; }, 900);
  }
  function holdEnd() {
    clearTimeout(holdTimer);
    fill.style.transition = 'transform .2s ease';
    fill.style.transform = 'scaleY(0)';
  }
  homeBtn.addEventListener('pointerdown', holdStart);
  homeBtn.addEventListener('pointerup', holdEnd);
  homeBtn.addEventListener('pointerleave', holdEnd);
  homeBtn.addEventListener('pointercancel', holdEnd);
})();
</script>
</body>
</html>
