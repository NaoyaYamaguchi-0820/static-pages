<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>おとあそび ｜ こどもあそび</title>
<meta name="description" content="どこを押してもきれいに響く、6色のおおきなボタンの音あそび。1歳から遊べます。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; touch-action: none;
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "Yu Gothic", system-ui, sans-serif;
    background: #2b2340;
  }
  body { display: flex; flex-direction: column; }
  .keys {
    flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 6px; padding: max(6px, env(safe-area-inset-top)) 6px max(6px, env(safe-area-inset-bottom));
  }
  @media (orientation: landscape) {
    .keys { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
  }
  .key {
    position: relative; border: 0; padding: 0; border-radius: 20px; cursor: pointer; overflow: hidden;
    display: grid; place-items: center; transition: transform .08s ease, filter .08s ease;
    font-size: clamp(56px, 20vmin, 150px); line-height: 1;
    font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  .key.on { transform: scale(.95); filter: brightness(1.25); }
  .key .glow {
    position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.95), transparent 62%);
    opacity: 0; pointer-events: none;
  }
  .key.on .glow { opacity: .85; transition: none; }
  .key .glow.fade { opacity: 0; transition: opacity .5s ease; }
  .note {
    position: fixed; pointer-events: none; z-index: 5; font-size: 40px;
    font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    animation: fly 1.1s ease-out forwards;
  }
  @keyframes fly {
    0% { opacity: 1; transform: translate(-50%, 0) scale(.6) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -150px) scale(1.3) rotate(22deg); }
  }
  .home, .sound {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 30;
    width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: rgba(255,255,255,.8); color: #4b3f63; font-size: 22px;
    display: grid; place-items: center; overflow: hidden; box-shadow: 0 2px 0 rgba(0,0,0,.15);
  }
  /* 自動再生の制限でおとが出ないとき、タップでかいじょするボタン */
  .sound { left: 72px; }
  .sound.waiting { animation: soundWait 1.2s ease-in-out infinite; }
  @keyframes soundWait { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  @media (prefers-reduced-motion: reduce) { .sound.waiting { animation: none; outline: 3px solid #fff; } }
  .home i { position: absolute; inset: 0; background: #c9b6ff; transform: scaleY(0); transform-origin: bottom; }
  .home span { position: relative; }
</style>
</head>
<body>
<div class="keys" id="keys"></div>
<button class="home" id="home" aria-label="ホームにもどる（ながおし）"><i id="homeFill"></i><span>🏠</span></button>
<button class="sound" id="sound" aria-label="タップしておとをだす"><span id="soundIcon">🔇</span></button>

<script>
(() => {
  'use strict';
  // ヨナ抜き（ペンタトニック）音階。どの順番で押しても濁らずきれいに響く
  const KEYS = [
    { emoji: '🐘', color: '#ff8fa3', freq: 262 },
    { emoji: '🐸', color: '#ffb703', freq: 294 },
    { emoji: '🐤', color: '#8ecae6', freq: 330 },
    { emoji: '🐰', color: '#95d5b2', freq: 392 },
    { emoji: '🐷', color: '#cdb4db', freq: 440 },
    { emoji: '🐱', color: '#ffb4a2', freq: 523 },
  ];
  const NOTES = ['🎵','🎶','♪','✨','🌟'];

  let ac = null;
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        ac = new AC();
        // suspended ⇔ running の変化をおとボタンの見ために反映する
        ac.addEventListener('statechange', refreshSound);
      }
    }
    // ブラウザの自動再生制限で止まっているときは、ここで解除をこころみる
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }

  // ---- おとボタン ----
  // AudioContext はユーザー操作があるまで suspended のままで音が出ない。
  // 「押せば必ず音が出る」入口をひとつ置き、いま鳴らせる状態かどうかも見せる。
  const soundBtn = document.getElementById('sound');
  const soundIcon = document.getElementById('soundIcon');

  function refreshSound() {
    const ready = !!ac && ac.state === 'running';
    soundIcon.textContent = ready ? '🔊' : '🔇';
    soundBtn.classList.toggle('waiting', !ready);
    soundBtn.setAttribute('aria-label', ready ? 'おとがでています' : 'タップしておとをだす');
  }

  // かくにん用の音。suspended のまま予約しても、解除された瞬間に鳴る
  function soundCheck() {
    const a = audio();
    if (!a) return;
    const t = a.currentTime;
    [523, 784].forEach((f, i) => {
      const s = t + i * 0.09;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, s);
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.22, s + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.4);
      o.connect(g).connect(a.destination);
      o.start(s); o.stop(s + 0.45);
    });
  }

  soundBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    soundCheck();
    refreshSound();
  });
  // タブを離れると中断されることがあるので、戻ってきたら見ためを合わせ直す
  document.addEventListener('visibilitychange', refreshSound);
  refreshSound();

  // やわらかいマリンバのような音
  function play(freq) {
    const a = audio();
    if (!a) return;
    const t = a.currentTime;
    const out = a.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.3, t + 0.012);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    out.connect(a.destination);

    const o1 = a.createOscillator();
    o1.type = 'triangle';
    o1.frequency.setValueAtTime(freq, t);
    const g1 = a.createGain();
    g1.gain.setValueAtTime(1, t);
    o1.connect(g1).connect(out);

    const o2 = a.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(freq * 4, t);
    const g2 = a.createGain();
    g2.gain.setValueAtTime(0.3, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o2.connect(g2).connect(out);

    o1.start(t); o2.start(t);
    o1.stop(t + 1.15); o2.stop(t + 1.15);
  }

  const keysEl = document.getElementById('keys');
  KEYS.forEach((k) => {
    const b = document.createElement('button');
    b.className = 'key';
    b.type = 'button';
    b.style.background = k.color;
    b.setAttribute('aria-label', 'おと');
    b.innerHTML = `<span class="glow"></span><span>${k.emoji}</span>`;
    const glow = b.querySelector('.glow');

    const hit = (x, y) => {
      play(k.freq);
      b.classList.add('on');
      glow.classList.remove('fade');
      setTimeout(() => { b.classList.remove('on'); glow.classList.add('fade'); }, 120);
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = NOTES[Math.floor(Math.random() * NOTES.length)];
      n.style.left = x + 'px';
      n.style.top = (y - 20) + 'px';
      document.body.appendChild(n);
      setTimeout(() => n.remove(), 1100);
    };

    b.addEventListener('pointerdown', (e) => hit(e.clientX, e.clientY));
    // 指をすべらせても、通りかかった鍵が鳴る
    b.addEventListener('pointerenter', (e) => { if (e.buttons || e.pressure > 0) hit(e.clientX, e.clientY); });
    keysEl.appendChild(b);
  });

  const homeBtn = document.getElementById('home');
  const fill = document.getElementById('homeFill');
  let holdTimer = null;
  homeBtn.addEventListener('pointerdown', () => {
    fill.style.transition = 'transform .9s linear';
    fill.style.transform = 'scaleY(1)';
    holdTimer = setTimeout(() => { location.href = 'index.html'; }, 900);
  });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) {
    homeBtn.addEventListener(ev, () => {
      clearTimeout(holdTimer);
      fill.style.transition = 'transform .2s ease';
      fill.style.transform = 'scaleY(0)';
    });
  }
})();
</script>
</body>
</html>
